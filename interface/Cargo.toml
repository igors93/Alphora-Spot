[package]
name = "alphora-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Native desktop interface for the Alphora futures trading engine"
license = "UNLICENSED"
publish = false

[[bin]]
name = "alphora-desktop"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "clipboard",
    "x11",
    "wayland",
] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rfd = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# Our own code gets light optimization too: the debug build stays fluid.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
